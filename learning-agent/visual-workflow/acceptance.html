<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>55项实际验收台账 · 上岸鸭</title><link rel="stylesheet" href="style.css"></head><body><main style="margin:0 auto;max-width:1200px"><header class="topbar"><a href="/">← 工作台</a><b>原55项 · 实际提交与验收</b></header><p class="hint">历史“资料处理完成”和本轮验收分别记录。文件齐全仅能进入复核，不能自动证明内容正确。姓名不同不等于已认证人员独立。</p><div id="msg" class="notice" hidden></div><section class="panel"><div id="counts" class="stat-row"></div><label>选择原任务<select id="choose"></select></label><div id="task"></div></section></main><script>
const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let rows=[],states={},token,active=0,busy=false;
const requestedTask=Number(new URLSearchParams(location.search).get('task'));if(Number.isInteger(requestedTask)&&requestedTask>=1&&requestedTask<=55)active=requestedTask-1;
const labels={pending:'待交付',historical_scoped_complete:'历史限定资料完成',pending_review:'待独立复核',passed:'本条人工记录通过',returned:'退回补做',invalidated:'证据已失效'};
function msg(s){$('#msg').hidden=!s;$('#msg').textContent=s;}
async function load(){const d=await(await fetch('/api/data')).json();token=d.token;states=d.states;rows=(await(await fetch('/api/acceptance')).json()).rows;render();}
function render(){const r=rows[active];$('#choose').innerHTML=rows.map((x,i)=>`<option value="${i}" ${i===active?'selected':''}>${x.task.id} · ${e(x.task.section)} · ${labels[x.effective_status]}</option>`).join('');const counts={};rows.forEach(x=>counts[x.effective_status]=(counts[x.effective_status]||0)+1);$('#counts').innerHTML=Object.entries(counts).map(([k,v])=>`<span>${labels[k]} ${v}</span>`).join('');let h=`<h2>第${r.task.id}项 · ${labels[r.effective_status]}</h2><p>${e(r.contract.requirement)}</p><p class="muted">负责人：${e(r.task.owner)}。历史原状态：${e(r.task.status)}</p>${r.invalid_reason?`<div class="notice">${e(r.invalid_reason)}</div>`:''}`;
const sub=r.record?.submission;if(sub)h+=`<div class="gap-card"><b>当前提交者：${e(sub.executor)}</b><p>${e(sub.note)}</p>${Object.entries(sub.artifacts).map(([role,a])=>`<p>${e(role)}：<a href="/api/submission?project=${r.project}&id=${encodeURIComponent(a.id)}">${e(a.filename)}</a></p>`).join('')}</div>`;
h+=`<form id="submit"><h3>提交本任务实际交付／修订</h3><label>实际执行者<input name="executor" required></label><label>交付说明<textarea name="note" required></textarea></label>${r.contract.roles.map((role,i)=>`<label>${e(role)}（20MB以内）<input type="file" name="file${i}" required></label>`).join('')}<button class="primary">校验附件并提交待复核</button></form>`;
if(r.effective_status==='pending_review')h+=`<form id="review"><h3>非执行者复核</h3><label>复核者<input name="reviewer" required></label>${r.contract.roles.map((role,i)=>`<div class="review-row"><b>${e(role)}</b><label>结果<select name="result${i}"><option value="unknown">未知</option><option value="fail">未通过</option><option value="pass">通过</option></select></label><label>检查的文件位置<input name="location${i}" required></label><label>具体依据<textarea name="note${i}" required></textarea></label></div>`).join('')}<label>上方原任务要求是否真正满足？<select name="requirement_result"><option value="unknown">未知</option><option value="fail">未满足</option><option value="pass">满足</option></select></label><label>原任务满足／未满足的具体依据<textarea name="requirement_note" required></textarea></label><button class="primary">保存复核，更新本条状态</button></form>`;
if(r.record?.review)h+=`<div class="hint">最近复核：${e(r.record.review.requirement_note)}。记录保留，重新提交会使旧通过失效。</div>`;
$('#task').innerHTML=h;bind();}
async function post(path,body){const r=rows[active];const res=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Workflow-Token':token},body:JSON.stringify({project:r.project,expected_revision:states[r.project].revision,...body})});const d=await res.json();if(!res.ok)throw Error(d.error);return d;}
function bind(){for(const id of ['submit','review']){const form=$('#'+id);if(!form)continue;form.onsubmit=async ev=>{ev.preventDefault();if(busy)return;busy=true;const b=form.querySelector('button');b.disabled=true;try{const f=new FormData(form),r=rows[active];let payload;if(id==='submit'){const artifacts={};for(let i=0;i<r.contract.roles.length;i++){const file=f.get('file'+i);if(file.size>20*1024*1024)throw Error('每份附件限制20MB');const data=await new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(String(fr.result).split(',')[1]);fr.onerror=reject;fr.readAsDataURL(file);});artifacts[r.contract.roles[i]]=(await post('/api/upload',{filename:file.name,data})).upload;}payload={executor:f.get('executor'),note:f.get('note'),artifacts};}else{const checks={};r.contract.roles.forEach((role,i)=>checks[role]={result:f.get('result'+i),location:f.get('location'+i),note:f.get('note'+i)});payload={submission_id:r.record.submission.id,reviewer:f.get('reviewer'),checks,requirement_result:f.get('requirement_result'),requirement_note:f.get('requirement_note')};}await post('/api/task-acceptance',{task_id:r.task.id,event:id,payload});await load();msg('已按实际提交和复核记录更新本条任务。');}catch(err){msg(err.message);}finally{busy=false;b.disabled=false;}};}}
$('#choose').onchange=ev=>{if(busy)return;active=Number(ev.target.value);render();};load().catch(err=>msg('连接失败：'+err.message));
</script></body></html>
