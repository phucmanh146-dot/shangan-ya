function blank(){return {version:10,tasks:[],blocks:[],fixed:[{id:'lunch',title:'午餐与休息',start:'12:00',end:'13:00'},{id:'dinner',title:'晚餐与散步',start:'18:00',end:'19:00'}],events:[],reminders:[],interventions:[],reviews:[],resources:[],goals:{month:'',week:''}}}
function log(s,type,taskId,text,now=Date.now()){s.events.push({id:uid(),type,taskId,text,at:now})}
function add(s,data,now=Date.now()) {const t={id:uid(),project:'未分类',kind:'工作',title:'',estimate:30,priority:2,hard:false,deadline:null,deadlineDate:'',deliverable:'',criteria:'',status:'待排期',total:0,continuous:0,checks:[],outputs:[],evidence:[],audit:[],parent:null,dependsOn:[],breakpoint:'',created:now,...data};s.tasks.push(t);log(s,'task.created',t.id,'创建任务：'+t.title,now);return t}
function remind(s,taskId,key,title,text,at,action='focus',now=Date.now()){if(s.reminders.some(r=>r.key===key&&r.taskId===taskId&&r.state!=='已取消'))return;s.reminders.push({id:uid(),taskId,key,title,text,at,action,state:'待触发',created:now});}
function invalidate(s,id){s.reminders.filter(r=>r.taskId===id&&r.state!=='已处理').forEach(r=>r.state='已取消')}
function schedule(s,now=Date.now()){
 s.blocks=s.blocks.filter(b=>(!b.locked||s.tasks.find(t=>t.id===b.taskId)?.status==='执行中')&&(b.end<=now||s.tasks.find(t=>t.id===b.taskId)?.status==='执行中'));
 const tasks=s.tasks.filter(t=>!['验收通过','验收失败','部分通过','无法核验','已归档','执行中','待验收','待提交证据'].includes(t.status)&&!s.interventions.some(i=>i.taskId===t.id&&!i.closed)).sort((a,b)=>(a.hard?0:1)-(b.hard?0:1)||(a.deadline||Infinity)-(b.deadline||Infinity)||b.priority-a.priority);

 // Reserve explicit appointments first. Replanning must never move a fixed course.
 for(const t of tasks.filter(t=>t.plannedStart)){
 const start=t.plannedStart,end=start+t.estimate*60000;

 if((t.dependsOn||[]).some(id=>s.tasks.find(x=>x.id===id)?.status!=='验收通过'))t.risk='固定开始时间已保留，但前置任务尚未验收';
 t.status=end<=now?'待确认开始时间':'已排期';remind(s,t.id,'start:appointment:'+start,'固定时间任务该开始了',t.title+' · 开始 '+new Date(start).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'}),start,'focus',now);if(t.risk)unplaced.push(t.title);placed++;}

 for(const t of flexible){s.reminders.filter(r=>r.taskId===t.id&&r.key.startsWith('start:')&&r.state!=='已处理').forEach(r=>r.state='已取消');if((t.dependsOn||[]).some(id=>s.tasks.find(x=>x.id===id)?.status!=='验收通过')){t.status='待排期';t.risk='等待前置任务验收通过';unplaced.push(t.title);continue}let left=Math.max(t.total>0?15:0,t.estimate-t.total/60);const existing=s.blocks.filter(b=>b.taskId===t.id&&b.end>now).reduce((n,b)=>n+(b.end-b.start)/60000,0);left=Math.max(0,left-existing);let cursor=now;let seq=0;

 const length=Math.min(30,left),end=start+length*60000,occupied=[...s.blocks,...s.fixed.map(f=>({start:local(day,f.start),end:local(day,f.end)}))];const conflict=occupied.find(b=>start<b.end&&end>b.start);
 if(conflict){cursor=conflict.end;continue}if(end>endDay){cursor=endDay;continue}if((t.deadline||(t.hard&&t.deadlineDate?local(t.deadlineDate,'00:00'):null))&&end>(t.deadline||local(t.deadlineDate,'00:00')))break;
 const b={id:uid(),taskId:t.id,start,end,part:++seq};s.blocks.push(b);remind(s,t.id,'start:'+b.id,'该开始这一小步了',t.title+' · '+length+' 分钟',start,'focus',now);cursor=end+5*60000;left-=length;placed++;
 }t.status=s.blocks.some(b=>b.taskId===t.id&&b.end>now)?'已排期':'待排期';t.risk=left>0?'剩余 '+Math.ceil(left)+' 分钟未能排入可用时间':'';if(t.risk)unplaced.push(t.title);log(s,'schedule.updated',t.id,t.risk||'已生成执行时间与休息缓冲',now);

function taskForm(id){const t=(id?getTask(id):null)||{};modal(id?'编辑任务':'让一件事，有明确的下一步','先说清楚要做什么，以及怎样才算完成。',`<form id="taskform" onsubmit="event.preventDefault();saveTask('${id||''}',this)"><label class="field">任务名称<input name="title" required maxlength="200" value="${esc(t.title)}" placeholder="例如：完成演示并录制验证视频"></label><div class="grid cols2"><label class="field">项目 / 主线<input name="project" value="${esc(t.project||'未分类')}"></label><label class="field">任务类型<select name="kind">${['工作','学习','开发','运营','生活'].map(k=>`<option ${t.kind===k?'selected':''}>${k}</option>`).join('')}</select></label></div><div class="grid cols3"><label class="field">预计分钟<input type="number" name="estimate" min="5" max="10080" required value="${t.estimate||30}"></label><label class="field">优先级<select name="priority">${[[3,'重要'],[2,'普通'],[1,'可延后']].map(([v,l])=>`<option value="${v}" ${t.priority===v?'selected':''}>${l}</option>`).join('')}</select></label><label class="field">截止类型<select name="hard"><option value="false">普通截止</option><option value="true" ${t.hard?'selected':''}>硬截止</option></select></label></div><label class="field">开始安排<select name="startMode" onchange="this.form.querySelector('[data-start-fields]').hidden=this.value!=='fixed'"><option value="auto">暂不确定 · 最迟 DDL 前 72 小时自动排期</option><option value="fixed" ${t.plannedStart?'selected':''}>固定开始时间（听课 / 预约等）</option></select></label><div class="grid cols2" data-start-fields ${t.plannedStart?'':'hidden'}><label class="field">开始日期<input name="startDate" type="date" value="${t.plannedStart?C.dateKey(t.plannedStart):''}"></label><label class="field">开始时刻（北京时间）<input name="startTime" type="time" value="${t.plannedStart?hm(t.plannedStart):''}"></label></div><div class="grid cols2"><label class="field">截止日期<input name="date" type="date" value="${esc(t.deadlineDate||'')}"></label><label class="field">具体截止时刻（可留空待核实）<input name="time" type="time" value="${t.deadline?hm(t.deadline):''}"></label></div><label class="field">前置任务（可选，验收通过后才能开始）<select name="dependsOn"><option value="">无前置任务</option>${available().filter(x=>x.id!==id).map(x=>`<option value="${x.id}" ${(t.dependsOn||[]).includes(x.id)?'selected':''}>${esc(x.title)}</option>`).join('')}</select></label><label class="field">交付物<textarea name="deliverable" required placeholder="一个文件、一段实操、订正后的答案…">${esc(t.deliverable)}</textarea></label><div class="field"><span>交付物参考示例图（可选）</span><p class="subtext">例如上传课程显示“已学完 / 100%”的截图，说明以后要交什么样的成果。参考图不计为完成证据。</p><input type="file" accept="image/png,image/jpeg,image/webp,image/gif" aria-label="上传交付物示例图" onchange="previewReference(this)"><input type="hidden" name="referenceImage" value="${esc(t.referenceImage||'')}"><div id="referencePreview">${referenceHTML(t)}</div><button type="button" class="plain" onclick="this.form.elements.namedItem('referenceImage').value='';$('#referencePreview').innerHTML=''">移除参考图</button></div><label class="field">验收标准（每行一条）<textarea name="criteria" required placeholder="写下能逐项检查的完成条件">${esc(t.criteria)}</textarea></label><div class="actions"><button class="primary">保存任务</button><button type="button" onclick="closeModal()">取消</button></div></form>`)}
function saveTask(id,f){const d=Object.fromEntries(new FormData(f));if(d.startMode==='fixed'&&(!d.startDate||!d.startTime))return toast('固定时间任务请填写开始日期和时刻');const plannedStart=d.startMode==='fixed'?C.local(d.startDate,d.startTime):null;if(plannedStart&&d.date&&d.time&&plannedStart>=C.local(d.date,d.time))return toast('开始时间必须早于截止时间');if(d.hard==='true'&&!d.date)return toast('硬截止任务需要填写截止日期');if(d.time&&!d.date)return toast('请同时填写日期');const data={plannedStart,referenceImage:d.referenceImage||'',title:d.title.trim(),project:d.project.trim()||'未分类',kind:d.kind,estimate:+d.estimate,priority:+d.priority,hard:d.hard==='true',deadlineDate:d.date,deadline:d.date&&d.time?C.local(d.date,d.time):null,deliverable:d.deliverable.trim(),criteria:d.criteria.trim(),dependsOn:d.dependsOn?[d.dependsOn]:[]};if(!data.title||!data.criteria||!data.deliverable)return toast('请补全任务名称、交付物与验收标准');if(id&&data.dependsOn.length){const seenDeps=new Set();const cycle=(dep)=>{if(dep===id)return true;if(seenDeps.has(dep))return false;seenDeps.add(dep);return (getTask(dep)?.dependsOn||[]).some(cycle)};if(data.dependsOn.some(cycle))return toast('前置任务形成循环，请选择其他任务')}if(id){const t=getTask(id);if(t.status==='执行中')return toast('请先暂停任务再编辑');if(t.criteria!==data.criteria)t.audit.push({at:Date.now(),result:'标准修改',note:'原标准：'+t.criteria,criteria:t.criteria,source:'本人修改'});Object.assign(t,data);C.invalidate(state,id);C.log(state,'task.edited',id,'编辑任务，重新计算相关提醒');C.schedule(state)}else{C.add(state,data);if(plannedStart)C.schedule(state)}closeModal();C.tick(state);if(persistRender())toast('已保存，开始时间与相关截止检查已更新')}
function detail(id){const t=getTask(id);if(!t)return;selected=id;modal(esc(t.title),`${esc(t.project)} · ${esc(t.kind)} · 任务 ${esc(t.id.slice(0,8))}`,`<div class="row">${statusTag(t)}${tag(t.hard?'硬截止':'普通任务',t.hard?'red':'')}<small>${t.estimate} 分钟 / 实际 ${(t.total/60).toFixed(1)} 分钟</small></div><div class="progressnote"><b>交付物</b><p>${esc(t.deliverable)}</p><br><b>验收标准</b><p style="white-space:pre-wrap">${esc(t.criteria)}</p></div>${referenceHTML(t)}<p class="section subtext">开始：${startLabel(t)}</p>${t.parent?`<p class="section subtext">关联原任务：${esc(getTask(t.parent)?.title||t.parent)}</p>`:''}${t.instructions?`<p class="section">${esc(t.instructions)}</p>`:''}<p class="section subtext">截止：${t.deadline?fmt(t.deadline):esc(t.deadlineDate||'未设置')+'（无精确时刻）'}</p>${t.breakpoint?`<div class="notice section">断点：${esc(t.breakpoint)}</div>`:''}<h3 class="section">成果与提交</h3>${t.outputs.map(o=>`<div class="filelink">${esc(o.text)}<small> · ${fmt(o.at)}</small></div>`).join('')||'<small>暂未记录产出</small>'}${t.evidence.map(e=>`<div class="filelink">◇ ${esc(e.name)} <button class="plain" onclick="downloadEvidence('${t.id}','${e.id}')">查看 / 下载</button></div>`).join('')}<div class="actions"><button class="primary" onclick="closeModal();selectFocus('${id}')">进入执行</button><button onclick="taskForm('${id}')">编辑任务</button><button onclick="evidenceForm('${id}')">提交证据</button><button onclick="acceptForm('${id}')">人工核对</button></div><div class="actions"><button onclick="submissionForm('${id}')">记录实际交付</button><button class="danger" onclick="archiveTask('${id}')">归档任务</button></div><h3 class="section">任务历史</h3>${state.events.filter(e=>e.taskId===id).slice(-8).reverse().map(e=>`<div class="logitem"><small>${fmt(e.at)}</small>${esc(e.text)}</div>`).join('')}`)}
function archiveTask(id){if(getTask(id).status==='执行中')return toast('请先暂停此任务');getTask(id).status='已归档';C.invalidate(state,id);state.blocks=state.blocks.filter(b=>b.taskId!==id);C.log(state,'task.archived',id,'任务已归档，可从任务中心恢复');closeModal();persistRender()}
function submissionForm(id){const t=getTask(id);modal('记录实际交付','验收通过与实际提交分别记录；此处是本人记录，未经官方平台核验。',`<form onsubmit="event.preventDefault();getTask('${id}').submission={at:Date.now(),receipt:this.elements.namedItem('receipt').value,source:'用户记录，未经平台核验'};C.log(state,'submission.recorded','${id}','记录实际交付凭证：'+this.elements.namedItem('receipt').value);closeModal();persistRender()"><label class="field">提交凭证 / 回执链接 / 编号<textarea name="receipt" required>${esc(t.submission?.receipt||'')}</textarea></label><button class="primary">保存交付记录</button></form>`)}
function tasksPage(){const list=(filter==='归档'?state.tasks.filter(t=>t.status==='已归档'):available()).filter(t=>(!query||(t.title+' '+t.project+' '+t.deliverable).toLowerCase().includes(query.toLowerCase()))&&(filter==='全部'||filter==='归档'||filter==='四象限'||filter==='硬截止'&&t.hard||t.status===filter));return `<div class="row wrap"><div class="tabs">${['全部','四象限','硬截止','待排期','执行中','待验收','验收通过','归档'].map(f=>`<button class="${filter===f?'active':''}" onclick="filter='${f}';render()">${f}</button>`).join('')}</div><button onclick="importForm()">⌑ 从其他 AI 导入</button></div>${query?`<div class="notice">搜索：${esc(query)} · ${list.length} 项 <button class="plain" onclick="query='';$('#search').value='';render()">清除</button></div>`:''}${filter==='四象限'?`<div class="taskboard">${[[true,true,'重要且紧急'],[true,false,'重要不紧急'],[false,true,'紧急不重要'],[false,false,'可安排 / 可放下']].map(([imp,urg,label])=>`<div class="card"><h2>${label}</h2>${list.filter(t=>(t.priority===3)===imp&&(!!t.deadline&&t.deadline-Date.now()<72*3600000)===urg).map(t=>taskrow(t)).join('')||'<p class="muted section">这一格暂时空着。</p>'}</div>`).join('')}</div>`:`<div class="card">${list.map(t=>filter==='归档'?`<div class="taskrow"><div class="body">${esc(t.title)}</div><button onclick="getTask('${t.id}').status='待排期';persistRender()">恢复</button></div>`:taskrow(t)).join('')||empty('这里还没有任务','添加任务，或粘贴已有的整理结果。')}</div>`}`}
function importForm(){modal('带上你已经整理好的任务','每行一项。支持普通文本，或包含 title / project / estimate / deliverable / criteria 的 JSON 数组。文本提取使用本地规则，不冒充 AI。',`<textarea id="importText" style="min-height:220px" placeholder="【学习计划】&#10;1. 整理第三章笔记&#10;2. 完成章节测试&#10;&#10;建议明确日期及交付物后再确认导入。"></textarea><div class="actions"><button class="primary" onclick="previewImport()">提取并预览</button></div>`)}
let importDraft=[];
function previewImport(){const raw=$('#importText').value.trim();if(!raw)return toast('先粘贴任务文本');try{if(raw.startsWith('[')){const v=JSON.parse(raw);if(!Array.isArray(v))throw Error();importDraft=v.filter(x=>typeof x.title==='string').slice(0,100).map(x=>({title:x.title,project:String(x.project||'外部 AI 导入'),estimate:Math.min(10080,Math.max(5,Number(x.estimate)||30)),deliverable:String(x.deliverable||''),criteria:String(x.criteria||'')}))}else{let project='外部 AI 导入';importDraft=[];for(let line of raw.split(/\r?\n/)){line=line.trim();if(!line)continue;if(/^[【#]/.test(line)){project=line.replace(/^[#【\s]+|[】\s]+$/g,'');continue}line=line.replace(/^[-*\d.、）)\s]+/,'');if(line)importDraft.push({title:line,project,estimate:30,deliverable:'',criteria:''})}importDraft=importDraft.slice(0,100)}}catch{return toast('JSON 格式不正确，请使用任务数组或普通文本')}modal('确认导入的任务',`提取 ${importDraft.length} 项。不会自动猜测日期或把建议当成硬截止；导入后请编辑确认交付物与标准。`,`<div class="scrolltable"><table><thead><tr><th>导入</th><th>任务 / 项目</th><th>预计分钟</th></tr></thead><tbody>${importDraft.map((t,i)=>`<tr><td><input type="checkbox" id="pick${i}" checked aria-label="导入第${i+1}项"></td><td>${esc(t.title)}<br><small>${esc(t.project)}</small></td><td><input type="number" id="mins${i}" min="5" max="10080" value="${t.estimate}" aria-label="第${i+1}项预计分钟"></td></tr>`).join('')}</tbody></table></div><div class="actions"><button class="primary" onclick="confirmImport()">确认导入所选任务</button><button onclick="importForm()">返回修改</button></div>`)}
function confirmImport(){let n=0;importDraft.forEach((t,i)=>{if($('#pick'+i).checked){const estimate=+$('#mins'+i).value;if(!(estimate>=5&&estimate<=10080))return;C.add(state,{...t,estimate,deliverable:t.deliverable||'待确认：请填写具体交付物',criteria:t.criteria||'待确认：请填写验收标准',needsClarification:!t.deliverable||!t.criteria});n++}});closeModal();persistRender();toast(`导入 ${n} 项；缺失的交付物和验收标准需补全`)}
function replan(){const incomplete=available().filter(t=>t.status!=='验收通过'&&(t.deliverable.startsWith('待确认')||t.criteria.startsWith('待确认')));if(incomplete.length){detail(incomplete[0].id);return toast('先补充导入任务的交付物与验收标准，再安排执行')}const result=C.schedule(state);save();render();toast(`已安排 ${result.placed} 个执行块${result.unplaced.length?'；'+result.unplaced.length+' 项时间不足，请调整范围或截止':''}`)}
let timelineDate=C.dateKey(Date.now());
function timelinePage(){const day=timelineDate;return `<div class="row wrap"><input type="date" aria-label="时间轴日期" value="${day}" onchange="timelineDate=this.value;render()" style="width:160px"><div class="actions"><button onclick="fixedForm()">＋ 固定事务</button><button class="primary" onclick="replan()">✧ 动态重新排期</button></div></div><div class="card section"><h2>◎ ${esc(day)} · 当日计划</h2><p class="subtext">左侧计划，右侧实际。以北京时间排期，普通任务避开固定事务，执行块之间保留 5 分钟缓冲。</p><div class="focusband"><small>本月聚焦</small><p>${esc(state.goals.month)||'暂未设置'}</p></div><div class="focusband week"><small>本周聚焦</small><p>${esc(state.goals.week)||'暂未设置'}</p></div></div><div class="card section"><div class="row"><h3>✧ 待排期任务池</h3><button class="plain" onclick="go('tasks')">查看全部 →</button></div><div class="chips">${available().filter(t=>t.status==='待排期').map(t=>`<button class="pillbutton" onclick="detail('${t.id}')">${esc(t.title)} · ${t.estimate}m</button>`).join('')||'<small>暂无待排期任务</small>'}</div><div class="legend"><span><i style="background:#b6a3cf"></i>执行计划</span><span><i style="background:#c6a374"></i>固定事务</span><span><i style="background:#8fae99"></i>实际记录</span></div><div class="timelinecols"><div><div class="row"><h3>● 计划 Plan</h3><small>${state.blocks.filter(b=>C.dateKey(b.start)===day).length} 个执行块</small></div>${timelineColumn(day,false)}</div><div><div class="row"><h3>● 实际 Actual</h3><small>仅展示已记录的执行</small></div>${timelineColumn(day,true)}</div></div><p class="subtext section">${state.tasks.filter(t=>t.risk).map(t=>esc(t.title+'：'+t.risk)).join('；')||'时间不足时会明确提示未排入的工作量，不挤占固定事务。'}</p></div>`}
function timelineColumn(day,actual){const base=C.local(day,'08:00'),end=C.local(day,'22:00');let blocks=actual?state.events.filter(e=>e.type==='execution.started'&&C.dateKey(e.at)===day).map(e=>{const stop=state.events.find(x=>x.taskId===e.taskId&&x.at>=e.at&&x.type==='execution.paused');return {taskId:e.taskId,start:e.at,end:stop?.at||Math.min(Date.now(),e.at+86400000)}}):[...state.blocks.filter(b=>C.dateKey(b.start)===day),...state.fixed.map(f=>({title:f.title,start:C.local(day,f.start),end:C.local(day,f.end),fixed:true}))];return `<div class="timeline" style="height:840px">${Array.from({length:14},(_,i)=>`<span class="hour" style="top:${i*60}px">${String(i+8).padStart(2,'0')}:00</span>`).join('')}${blocks.filter(b=>b.end>base&&b.start<end).map(b=>{const top=Math.max(0,(b.start-base)/60000),height=Math.max(25,(Math.min(end,b.end)-Math.max(base,b.start))/60000);return `<div class="slot ${b.fixed||b.locked?'fixed':actual?'actual':''}" style="top:${top}px;height:${height}px" ${b.taskId?`onclick="detail('${b.taskId}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')detail('${b.taskId}')"`:''}><b>${esc(b.title||getTask(b.taskId)?.title||'历史任务')}</b><small>${hm(b.start)}—${hm(b.end)} ${b.fixed||b.locked?'· 固定时间':''}</small></div>`}).join('')}</div>`}

function focusPage(){const t=active()||getTask()||available().find(t=>t.status!=='验收通过');if(t)selected=t.id;return `${metrics()}<div class="timerlayout section"><div class="card timer"><div class="row"><h2>◷ ${mode}</h2>${tag(t?.status==='执行中'?'专注中':'准备开始')}</div><small>专注与恢复，都有自己的节奏。</small><div class="ring"><small id="timerStatus">${t?.status||'未选择任务'}</small><strong id="timerDisplay">25:00</strong><small id="elapsed">有效执行 0 分钟</small></div><select aria-label="当前执行任务" onchange="selected=this.value;render()" ${active()?'disabled':''}>${!t?'<option value="">先创建一项任务</option>':''}${available().filter(x=>x.status!=='验收通过').map(x=>`<option value="${x.id}" ${t?.id===x.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select><div class="actions" style="justify-content:center"><button class="primary" onclick="toggleFocus()">${t?.status==='执行中'?'Ⅱ 暂停':'▷ 开始执行'}</button><button onclick="rest()">♧ 休息</button><button onclick="if(selected)checkForm(selected)">记进展</button></div><p class="subtext section">休息和暂停不计入有效时长；关闭网页后不会继续假计时。</p></div><div><div class="card"><div class="modes">${['普通番茄','沉浸正计时','四阶段专注','觉察番茄'].map(m=>`<button class="${mode===m?'active':''}" onclick="changeMode('${m}')">${m}</button>`).join('')}</div><label class="field">专注时长<select onchange="minutes=+this.value;savePreferences();updateTimer()">${[15,25,30,45,60].map(n=>`<option ${n===minutes?'selected':''}>${n}</option>`).join('')}</select></label><p class="subtext">普通番茄到时询问成果；四阶段按 15 分钟检查；觉察番茄每 10 分钟检查状态；沉浸模式显示正计时。所有模式保留反死磕保护。</p></div><div class="card section"><h3>本轮要留下什么？</h3><p class="section">${esc(t?.deliverable||'创建任务时，先确定一份具体的交付物。')}</p>${referenceHTML(t)}<p class="subtext section">开始：${t?startLabel(t):'尚未安排'}</p><div class="divider"></div><small>验收标准</small><p class="subtext" style="white-space:pre-wrap">${esc(t?.criteria||'尚未设置')}</p>${t?.breakpoint?`<div class="progressnote">上次断点：${esc(t.breakpoint)}</div>`:''}<div class="actions"><button onclick="coach()">✧ 我卡住了</button><button onclick="if(selected)evidenceForm(selected)">提交成果 →</button></div></div></div><div class="card"><h3>最近执行记录</h3><div class="section">${state.events.filter(e=>e.type.startsWith('execution')||e.type==='output.recorded').slice(-7).reverse().map(e=>`<div class="logitem"><small>${fmt(e.at)}</small>${esc(e.text)}</div>`).join('')||'<p class="muted">第一段专注，从现在开始。</p>'}</div></div></div><div class="card section"><div class="row"><h2>✧ 动态巡检，不让努力空转</h2>${tag('90 分钟干预上限')}</div><div class="stagebar">${['0—30 正常执行','30—45 效率检查','45—60 主动解卡','60—90 缩小范围','90 暂停与诊断'].map((l,i)=>`<span class="${t&&Math.floor(t.continuous/60)>=[0,30,45,60,90][i]?'current':''}">${l}</span>`).join('')}</div><p class="subtext">超时或连续两次本人反馈无产出可提前介入。未授权桌面助手时，无法核验电脑实际活动。</p></div>`}
function changeMode(m){if(active())return toast('请先暂停，再切换计时模式');mode=m;savePreferences();render()}
function savePreferences(){state.preferences={mode,minutes};save()}
function updateTimer(){const t=active()||getTask();if($('#timerDisplay')){const elapsed=t?.sessionSeconds||0;$('#timerDisplay').textContent=timerText(mode==='沉浸正计时'?elapsed:Math.max(0,minutes*60-elapsed));$('#elapsed').textContent='累计有效 '+((t?.total||0)/60).toFixed(1)+' 分钟 · 连续 '+((t?.continuous||0)/60).toFixed(1)+' 分钟';$('#timerStatus').textContent=t?.status||'未选择任务'}if($('#miniTimer'))$('#miniTimer').textContent=timerText(t?.sessionSeconds||0)}
function toggleFocus(){const t=getTask();if(!t)return taskForm();if(t.deliverable.startsWith('待确认')||t.criteria.startsWith('待确认'))return taskForm(t.id);try{if(t.status==='执行中')C.pause(state,t.id);else{const pending=state.interventions.find(i=>i.taskId===t.id&&!i.closed&&!i.actionId);if(pending)return diagnoseForm(pending.id);C.start(state,t.id);if(mode==='四阶段专注')t.nextCheck=t.continuous+900;if(mode==='觉察番茄')t.nextCheck=t.continuous+600;}persistRender()}catch(e){toast(e.message)}}
function rest(){const t=active()||getTask();if(t?.status==='执行中')C.pause(state,t.id,'开始休息');if(t){t.breakStarted=Date.now();C.remind(state,t.id,'rest:'+Date.now(),'休息结束，感觉怎么样？','恢复后再决定继续、换任务或重新排期。',Date.now()+5*60000,'check')}save();modal('给自己一点恢复时间','原任务计时已暂停。是否离开电脑仍无法自动核验。',`<p>喝水、走一走，或者闭目休息。5 分钟后会在网页运行时提醒检查状态。</p><div class="actions"><button class="primary" onclick="confirmRest('${t?.id||''}')">我已休息完，记录精力</button><button onclick="closeModal();render()">先去休息</button></div>`)}
function confirmRest(id){const t=getTask(id);if(t&&Date.now()-t.breakStarted>=5*60000){t.continuous=0;t.overrun=false;C.log(state,'rest.confirmed',id,'本人确认休息结束；连续时长重置，历史产出检查保留')}else if(t)toast('不足 5 分钟，本轮连续有效时长保留');closeModal();if(t)checkForm(id);save()}
function checkForm(id){const t=getTask(id);if(!t)return;selected=id;modal('这一小步，进展怎么样？',esc(t.title),`<form onsubmit="event.preventDefault();recordCheck('${id}',this)"><label class="field">本轮产出<select name="has"><option value="yes">有新产出，记录结果</option><option value="no">没有新产出 / 目前卡住</option></select></label><label class="field">成果 / 进展说明<textarea name="output" placeholder="写下完成了哪一步、得到了什么；需要验收的成果另附证据。"></textarea></label><label class="field">当前困难<textarea name="difficulty" placeholder="可选：具体报错、不会操作的步骤、缺少的资料…"></textarea></label><label class="field">当前精力<select name="energy"><option>正常</option><option>充足</option><option>疲惫</option></select></label><div class="actions"><button class="primary">记录并决定下一步</button><button type="button" onclick="closeModal();evidenceForm('${id}')">已完成，交成果</button></div></form>`)}
function recordCheck(id,f){const d=Object.fromEntries(new FormData(f));if(d.has==='yes'&&!d.output.trim())return toast('请写下具体产出，或选择没有新产出');C.check(state,id,d.has==='yes'?d.output.trim():'');C.log(state,'energy.feedback',id,'精力：'+d.energy+(d.difficulty?'；困难：'+d.difficulty:''));state.reviews.push({type:'energy',at:Date.now(),energy:{疲惫:3,正常:6,充足:8}[d.energy]});state.reminders.filter(r=>r.taskId===id&&r.state==='已触发'&&['check:','overrun','pomo:'].some(k=>r.key.startsWith(k))).forEach(r=>r.state='已处理');if(d.energy==='疲惫'||d.difficulty)C.intervene(state,id,d.energy==='疲惫'?'用户反馈疲惫':'用户反馈困难：'+d.difficulty);closeModal();save();const i=state.interventions.find(i=>i.taskId===id&&!i.closed);if(i)diagnoseForm(i.id);else{render();toast('已记录进展，可继续执行或提交成果')}}
function coach(){const t=active()||getTask()||available().find(t=>t.status!=='验收通过');if(!t){go('tasks');return toast('先创建或选择一项需要解卡的任务')}selected=t.id;const i=state.interventions.find(i=>i.taskId===t.id&&!i.closed)||C.intervene(state,t.id,'用户主动请求解卡');save();render();diagnoseForm(i.id)}
function diagnoseForm(iid){const i=state.interventions.find(x=>x.id===iid),t=getTask(i.taskId);selected=t.id;modal('✧ 先停一下，一起找到出口',esc(t.title)+' · '+esc(i.reason),`<div class="notice">原任务已暂停，计时断点已保存。电脑活动：${esc(i.stopStatus)}。${i.done15?'15 分钟复查缺少新产出，请调整诊断和行动。':''}</div><form onsubmit="event.preventDefault();submitDiagnosis('${iid}',this)"><label class="field">保存当前断点：改了哪些文件 / 最后成功步骤 / 当前报错 / 可保留成果<textarea name="checkpoint" required>${esc(t.breakpoint)}</textarea></label><label class="field">现在主要卡在哪里？<select name="kind">${['技术错误','不会操作','缺少资料','方案无效','精力不足','部分成果','已解决'].map(k=>`<option ${i.diagnosis===k?'selected':''}>${k}</option>`).join('')}</select></label><label class="field">当前精力<select name="energy"><option>正常</option><option>充足</option><option>疲惫</option></select></label><label class="field">停止情况（本人反馈）<select name="stop"><option>无法核验</option><option>本人确认已停止</option><option>本人反馈仍在原任务操作</option></select></label><p class="subtext">未接入 AI：根据诊断使用本地行动模板；可复制任务上下文交给其他 AI 深入定位。</p><div class="actions"><button class="primary">保存断点，生成下一步</button><button type="button" onclick="contextForm('${t.id}')">整理给外部 AI 的上下文</button></div></form>${i.actionId?`<div class="progressnote">已有行动：${esc(getTask(i.actionId)?.title)}<button class="plain" onclick="closeModal();selectFocus('${i.actionId}')">进入行动 →</button></div>`:''}`)}
function submitDiagnosis(id,f){const d=Object.fromEntries(new FormData(f)),i=state.interventions.find(x=>x.id===id);if(i.actionId&&!i.done15)return toast('已有下一步行动，请先执行或等待结果复查');if(i.actionId){const previous=getTask(i.actionId);if(previous.status==='执行中')C.pause(state,previous.id,'重新诊断，停止上一轮尝试');previous.status='已归档';C.invalidate(state,previous.id);C.log(state,'action.superseded',previous.id,'复查后被新行动替代，记录保留')}
try{i.stopStatus=d.stop;const a=C.diagnose(state,id,d.kind,d.energy,d.checkpoint);C.schedule(state);closeModal();persistRender();detail(a.id);toast('已创建 15 分钟行动，关联原任务并设置结果复查')}catch(e){toast(e.message)}}
function interventionsPage(){return `<div class="notice">停止验证来源：网页计时与本人反馈。桌面活动助手未连接，因此不能独立证明你已停止操作。</div>${state.interventions.length?state.interventions.slice().reverse().map(i=>`<div class="card section"><div class="row"><h2>${esc(getTask(i.taskId)?.title)}</h2>${tag(i.closed?'已记录后续成果':'待处理',i.closed?'green':'red')}</div><p class="muted">${fmt(i.at)} · ${esc(i.reason)}</p><div class="stagebar"><span class="current">暂停与保存</span><span class="${i.diagnosis?'current':''}">诊断与行动</span><span class="${i.done5?'current':''}">5 分钟停止检查</span><span class="${i.done15?'current':''}">15 分钟结果复查</span></div><p class="subtext">停止状态：${esc(i.stopStatus)} · ${i.actionId?'下一步：'+esc(getTask(i.actionId)?.title):'尚未生成下一步'}</p><div class="actions"><button class="primary" onclick="diagnoseForm('${i.id}')">${i.done15?'重新诊断 / 查看行动':'处理干预'}</button>${i.actionId?`<button onclick="selectFocus('${i.actionId}')">执行下一步</button>`:''}<button onclick="stopFeedback('${i.id}')">更新停止反馈</button></div></div>`).join(''):empty('目前没有待处理的卡点','执行中超时、连续两次无产出或达到 90 分钟，会进入这里。','coach()','主动请求解卡')}`}
function stopFeedback(id){modal('更新停止情况','反馈来源会保留，网页不会把本人确认当成独立检测证据。',`<div class="actions">${['本人确认已停止','本人反馈仍在原任务操作','无法核验'].map(x=>`<button onclick="state.interventions.find(i=>i.id==='${id}').stopStatus='${x}';C.log(state,'stop.feedback',state.interventions.find(i=>i.id==='${id}').taskId,'${x}');closeModal();persistRender()">${x}</button>`).join('')}</div>`)}
function contextForm(id){const t=getTask(id);modal('整理给其他 AI 的上下文','复制后带到你正在使用的 AI。这里不会自动发送任何任务或文件。',`<textarea style="min-height:280px" id="contextText" readonly>${esc(`任务：${t.title}\n交付物：${t.deliverable}\n验收标准：${t.criteria}\n截止：${t.deadline?fmt(t.deadline):t.deadlineDate||'未设置'}\n当前断点：${t.breakpoint||'待补充'}\n已有进展：${t.outputs.map(o=>o.text).join('；')||'待补充'}\n请根据以上真实信息，指出缺少的上下文，并给出一个 15 分钟内可验证的下一步。`)}</textarea><button class="primary section" onclick="copyContext()">复制上下文</button>`)}
async function copyContext(){try{await navigator.clipboard.writeText($('#contextText').value);toast('已复制')}catch{$('#contextText').select();toast('请按 Ctrl+C 复制')}}
function remindersPage(){return `<div class="notice blue">本地提醒仅在网页运行时触发；重新打开会补查截止与到点事件。关页通知、跨设备推送尚未接入。</div><div class="card"><div class="row"><h2>♧ 动态提醒</h2><button onclick="scanNow()">检查当前触发条件</button></div>${state.reminders.filter(r=>r.state!=='已取消').slice().sort((a,b)=>b.at-a.at).map(r=>`<div class="taskrow"><div class="body"><h3>${esc(r.title)} ${tag(r.state,r.state==='已触发'?'red':'')}</h3><p>${esc(r.text)}</p><small>${fmt(r.at)} · ${esc(getTask(r.taskId)?.title||'任务')}</small></div><button onclick="openReminder('${r.id}')">处理 →</button>${r.state==='已触发'?`<button class="plain" onclick="snooze('${r.id}')">稍后 5 分钟</button>`:''}</div>`).join('')||empty('还没有需要处理的提醒','排期后会生成到点提醒，任务状态变化也会触发检查。','','')}</div>`}
function scanNow(){const due=C.tick(state);save();render();toast(`检查完成，${due.length} 条新提醒`)}
function snooze(id){const r=state.reminders.find(r=>r.id===id);r.state='待触发';r.at=Date.now()+300000;seen.delete(id);C.log(state,'reminder.snoozed',r.taskId,'提醒延后 5 分钟，截止风险仍保留');persistRender()}
function openReminder(id){const r=state.reminders.find(r=>r.id===id);if(!r)return;r.state='已处理';selected=r.taskId;save();closeModal();switch(r.action){case 'intervene':{const i=state.interventions.find(i=>i.taskId===r.taskId&&!i.closed);if(i)diagnoseForm(i.id);else go('interventions');break}case 'check':checkForm(r.taskId);break;case 'detail':detail(r.taskId);break;default:selectFocus(r.taskId)}}
function showDue(due){const priority=[...due].sort((a,b)=>Number(b.action==='intervene')-Number(a.action==='intervene'));const r=priority.find(r=>!seen.has(r.id));if(!r||$('#modal').open)return;seen.add(r.id);modal(esc(r.title),'上岸鸭 · 执行提醒',`<div class="notice">${esc(r.text)}</div><p>${esc(getTask(r.taskId)?.title||'')}</p><p class="subtext section">触发时间：${fmt(r.at)}${Date.now()-r.at>120000?' · 补查到的提醒':''}</p><div class="actions"><button class="primary" onclick="openReminder('${r.id}')">现在处理 →</button><button onclick="snooze('${r.id}');closeModal()">5 分钟后提醒</button><button onclick="closeModal()">留在提醒中心</button></div>`)}
async function initDB(){if(!('indexedDB'in window))return;return new Promise(resolve=>{const req=indexedDB.open('duck-v10-evidence',1);req.onupgradeneeded=()=>req.result.createObjectStore('files');req.onsuccess=()=>{db=req.result;resolve()};req.onerror=()=>resolve()})}
function fileStore(key,blob){return new Promise((resolve,reject)=>{if(!db)return reject(Error('本地文件数据库不可用'));const tx=db.transaction('files','readwrite');tx.objectStore('files').put(blob,workspace+':'+key);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(Error('文件保存失败，可能空间不足'))})}
async function downloadEvidence(tid,eid){const e=getTask(tid)?.evidence.find(e=>e.id===eid);if(!e)return;if(e.url)return window.open(e.url,'_blank','noopener,noreferrer');if(!db)return toast('当前浏览器无法读取本地文件');const req=db.transaction('files').objectStore('files').get(workspace+':'+eid);req.onsuccess=()=>{if(!req.result)return toast('文件不在此浏览器中；导入备份只恢复元数据，请重新关联文件');const url=URL.createObjectURL(req.result);downloadURL(url,e.name);setTimeout(()=>URL.revokeObjectURL(url),60000)}}
function downloadURL(url,name){const a=document.createElement('a');a.href=url;a.download=name;a.click()}
function evidenceForm(id){const t=getTask(id);if(!t)return;selected=id;modal('提交一份真实成果',esc(t.title),`<div class="progressnote">交付物：${esc(t.deliverable)}<br>标准：${esc(t.criteria)}</div>${referenceHTML(t)}<form onsubmit="event.preventDefault();submitEvidence('${id}',this)"><label class="field">成果文件（图片、文档、视频等，单次最多 30MB）<input type="file" name="file" multiple></label><label class="field">或成果链接<input type="url" name="url" placeholder="https://"></label><label class="field">结果说明<textarea name="note" required placeholder="这份成果对应哪些标准？还有什么不能确认？"></textarea></label><p class="subtext">文件仅保存在当前浏览器本机数据库。未连接 AI，提交后等待人工核对，不会自动宣布通过。</p><div class="actions"><button class="primary">保存证据，进入待验收</button></div></form>`)}
async function submitEvidence(id,f){const files=Array.from(f.elements.namedItem('file').files),url=f.elements.namedItem('url').value.trim(),note=f.elements.namedItem('note').value.trim();if(!files.length&&!url)return toast('请至少选择一个文件或填写成果链接');if(url&&!/^https?:\/\//i.test(url))return toast('成果链接只支持 http / https');if(files.reduce((n,f)=>n+f.size,0)>30*1024*1024)return toast('单次文件总量请控制在 30MB 以内');const btn=f.querySelector('button');btn.disabled=true;try{const t=getTask(id),items=[];for(const file of files){const eid=C.uid();await fileStore(eid,file);items.push({id:eid,name:file.name,size:file.size,type:file.type,note,at:Date.now(),source:'本人上传'})}if(url)items.push({id:C.uid(),name:url,url,note,at:Date.now(),source:'本人提供链接'});if(t.status==='执行中')C.pause(state,id,'结束执行并提交成果');t.evidence.push(...items);t.status='待验收';C.invalidate(state,id);C.log(state,'evidence.submitted',id,'已提交 '+items.length+' 份证据，等待人工核对');closeModal();persistRender();toast('证据已保存；AI 未连接，等待人工核对')}catch(e){toast(e.message);btn.disabled=false}}
function evidencePage(){const ts=available().filter(t=>t.evidence.length||['待验收','待提交证据','验收失败','部分通过','无法核验','验收通过'].includes(t.status));return `<div class="notice blue">AI 审核未连接。本地版支持证据归档与人工逐项核对；文件存在或本人点击完成，都不会自动成为验收通过。</div>${metrics()}<div class="card section"><h2>◇ 成果与审核记录</h2>${ts.map(t=>`<div class="taskrow"><div class="body"><h3>${esc(t.title)}</h3><p>${t.evidence.length} 份证据 · ${t.audit.length} 次核对 · ${t.submission?'已记录实际交付':'尚未记录实际交付'}</p></div>${statusTag(t)}<button onclick="detail('${t.id}')">证据与详情</button><button onclick="acceptForm('${t.id}')">逐项核对</button></div>`).join('')||empty('成果值得留下来','在任务执行页提交文件或链接，即可开始核对。','go(\'tasks\')','选择任务')}<h3 class="section">验收与交付分别记录</h3><p class="subtext">验收通过说明成果符合已记录标准；比赛、作业的实际提交，还需要保存回执或提交凭证。</p></div>`}
function acceptForm(id){const t=getTask(id);if(!t)return;const lines=t.criteria.split(/\n/).filter(Boolean);modal('逐项核对成果','当前为人工核对。请先查看原始证据，再填写结论。',`<h3>${esc(t.title)}</h3>${referenceHTML(t)}${t.evidence.map(e=>`<div class="filelink">${esc(e.name)}<p class="subtext">${esc(e.note)}</p><button class="plain" onclick="downloadEvidence('${id}','${e.id}')">查看证据 ↗</button></div>`).join('')||'<div class="notice red">尚无成果证据，不能验收通过。</div>'}<form onsubmit="event.preventDefault();submitAccept('${id}',this)">${lines.map((l,i)=>`<label class="checkline"><input type="checkbox" name="criterion" value="${i}">${esc(l)}</label>`).join('')}<label class="field">核对结论<select name="result"><option>待验收</option><option>验收通过</option><option>部分通过</option><option>验收失败</option><option>无法核验</option></select></label><label class="field">依据 / 缺失项 / 返工要求<textarea name="note" required></textarea></label><button class="primary">保存人工核对记录</button></form><h3 class="section">历史核对（标准快照保留）</h3>${t.audit.map(a=>`<div class="logitem"><small>${fmt(a.at)} · ${esc(a.source)}</small>${esc(a.result)}：${esc(a.note)}<p class="subtext">当时标准：${esc(a.criteria)}</p></div>`).join('')}`)}
function submitAccept(id,f){if(!getTask(id).criteria.trim()||getTask(id).criteria.startsWith('待确认'))return toast('请先确认验收标准再核对');const result=f.elements.namedItem('result').value;if(result==='待验收')return toast('请选择实际核对结论');if(result==='验收通过'&&Array.from(f.querySelectorAll('input[type=checkbox]')).some(c=>!c.checked))return toast('请逐项核对全部标准；未满足时选择部分通过或失败');try{C.accept(state,id,result,f.elements.namedItem('note').value);closeModal();persistRender();toast(result==='验收通过'?'已更新全部关联视图并取消失效提醒':['验收失败','部分通过'].includes(result)?'已创建关联返工任务并重新排期':'已记录无法核验的原因')}catch(e){toast(e.message)}}
function projectsPage(){const names=[...new Set(available().map(t=>t.project))];return `<div class="grid cols3">${names.map((p,index)=>{const ts=available().filter(t=>t.project===p),done=ts.filter(t=>t.status==='验收通过').length;return `<div class="card"><div class="projecticon">${['🌱','📖','☀','🧩'][index%4]}</div><h2>${esc(p)}</h2><p class="subtext">${ts.length} 项任务 · ${done} 项已验收</p><div class="bar"><i style="width:${done/ts.length*100}%"></i></div><div class="section">${ts.map(t=>taskrow(t,true)).join('')}</div><button class="section" onclick="projectTaskForm('${esc(encodeURIComponent(p).replace(/'/g,'%27'))}')">＋ 为项目加一步</button></div>`}).join('')||`<div class="card">${empty('项目从一个目标开始','创建任务并填写项目名，任务会自动归入对应主线。')}</div>`}</div>`}
function projectTaskForm(p){taskForm();$('#taskform').elements.namedItem('project').value=decodeURIComponent(p)}
function learningPage(){const ts=available().filter(t=>t.kind==='学习');return `<div class="hero"><h2>从“看过了”，走到“我会了”。</h2><p>课程笔记、实操、主动回忆与错题订正，共用同一套任务和证据系统。</p><div class="steps"><span>学习资料</span> → <span>章节学习</span> → <span>自测与实操</span> → <span>订正与复习</span></div><div class="illustration">📖</div></div><div class="row"><h2>学习任务</h2><button onclick="learningForm()">＋ 新建学习任务</button></div><div class="card section">${ts.map(t=>taskrow(t)).join('')||empty('今天想真正掌握什么？','把一章课程拆成学习、测试和订正三小步。','learningForm()','新建学习任务')}</div><div class="grid cols3 section">${[['课程与笔记','上传课程资料，在任务中写明章节与笔记标准。'],['错题与订正','以原题、原答案和订正答案作为证据，关联同一个学习项目。'],['记忆与复习','从已有学习任务创建复习任务，重新测试理解。']].map(([l,d])=>`<div class="card"><h3>${l}</h3><p class="subtext section">${d}</p><button class="section" onclick="learningForm()">创建相关任务 →</button></div>`).join('')}</div><div class="notice blue section">OCR、自动出题、批改与间隔复习算法尚未接入。本地版可以真实记录学习任务和核对证据，不会从摄像头或播放进度推断“已掌握”。</div>`}
function learningForm(){taskForm();$('#taskform').elements.namedItem('kind').value='学习';$('#taskform').elements.namedItem('project').value='学习计划'}
function resourcesPage(){return `<div class="grid cols2"><div class="card"><h2>⌑ 资料收集箱</h2><p class="subtext">保存链接、文字和任务关系。链接保存不等于已读取正文。</p><button class="section" onclick="resourceForm()">＋ 添加资料</button>${state.resources.map(r=>`<div class="taskrow"><div class="body"><h3>${esc(r.title)}</h3><p>${esc(getTask(r.taskId)?.title||'未关联任务')} · ${esc(r.url?'仅保存链接，未读取':'本人提供文本')}</p>${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">打开原始资料 ↗</a>`:`<p>${esc(r.text)}</p>`}</div></div>`).join('')}</div><div class="card"><h2>✧ 和你的其他 AI 一起工作</h2><p class="subtext section">已有任务整理结果可以批量导入；卡壳时可以整理上下文，交给你熟悉的 AI，再把具体行动和成果带回来。</p><div class="actions"><button class="primary" onclick="importForm()">导入 AI 整理结果</button><button onclick="coach()">整理解卡上下文</button></div><div class="divider"></div>${['AI 模型 / API','飞书文档与 Wiki','Obsidian 本地知识库','微信任务收集','音视频解析 / OCR'].map(l=>`<div class="row section"><span>${l}</span>${tag('未连接')}</div>`)}<p class="subtext section">本版本不会收集或保存模型密钥。外部读取和 AI 调用需要后续接入服务端。</p></div></div>`}
function resourceForm(){modal('添加任务资料','资料只在本机保存。外部链接不会被自动读取。',`<form onsubmit="event.preventDefault();saveResource(this)"><label class="field">资料名称<input name="title" required></label><label class="field">链接<input type="url" name="url" placeholder="https://"></label><label class="field">或粘贴资料正文<textarea name="text"></textarea></label><label class="field">关联任务<select name="taskId"><option value="">暂不关联</option>${available().map(t=>`<option value="${t.id}">${esc(t.title)}</option>`).join('')}</select></label><button class="primary">保存资料</button></form>`)}
function saveResource(f){const d=Object.fromEntries(new FormData(f));if(!d.url&&!d.text.trim())return toast('请提供链接或正文');if(d.url&&!/^https?:\/\//i.test(d.url))return toast('只支持 http / https 链接');state.resources.push({id:C.uid(),...d,at:Date.now()});C.log(state,'resource.saved',d.taskId,'关联资料：'+d.title);closeModal();persistRender()}
function chart(){const vals=state.reviews.filter(r=>r.type==='energy').slice(-12);return `<svg class="chart" viewBox="0 0 700 220" role="img" aria-label="最近十二次本人精力评分">${[0,2,4,6,8,10].map(n=>`<line x1="35" y1="${190-n*16}" x2="680" y2="${190-n*16}"/><text x="10" y="${194-n*16}">${n}</text>`).join('')}${vals.length?`<polyline points="${vals.map((v,i)=>`${50+i*600/Math.max(1,vals.length-1)},${190-v.energy*16}`).join(' ')}" fill="none" stroke="#8da89b" stroke-width="2.5"/>${vals.map((v,i)=>`<circle cx="${50+i*600/Math.max(1,vals.length-1)}" cy="${190-v.energy*16}" r="4" fill="#8da89b"/><text x="${40+i*600/Math.max(1,vals.length-1)}" y="213">${hm(v.at)}</text>`).join('')}`:'<text x="220" y="110">记录状态后，精力曲线会在这里生长</text>'}</svg>`}
function reviewPage(){const today=C.dateKey(Date.now()),saved=state.reviews.findLast?state.reviews.findLast(r=>r.type==='daily'&&r.date===today):state.reviews.filter(r=>r.type==='daily'&&r.date===today).slice(-1)[0];return `${metrics()}<form id="reviewForm" onsubmit="event.preventDefault();saveReview(this)"><div class="card section"><div class="row"><h2>☾ ${today} · 今日复盘</h2><button class="primary">保存复盘并处理明日安排</button></div><div class="grid cols2 section"><label class="field">今天的成果与收获<textarea name="summary" placeholder="完成了什么？有什么值得肯定？">${esc(saved?.summary)}</textarea></label><label class="field">困难与调整<textarea name="difficulty" placeholder="什么卡住了？下次可以怎样做？">${esc(saved?.difficulty)}</textarea></label></div><label class="field">未完成任务如何处理<select name="carry"><option value="keep">保留，重新安排后续时间</option><option value="manual">先保留，明天手动确认</option></select></label><p class="subtext">需要取消或缩小范围的任务，可从任务详情编辑或归档；不会默认替你删除。</p></div><div class="card section"><h2>🌸 今日生命之花</h2><p class="subtext">为生活的不同部分留一点关心。分数仅在点击保存后写入记录。</p><div class="flower">${['事业','财务','健康 / 身体','家庭 / 亲密','社交 / 朋友','成长 / 学习','娱乐','自我'].map((l,i)=>`<div class="sliderrow"><label for="flower${i}">${l}</label><input id="flower${i}" name="flower${i}" type="range" min="0" max="10" value="${saved?.flower?.[i]??5}" oninput="this.nextElementSibling.value=this.value"><output>${saved?.flower?.[i]??5}</output></div>`).join('')}</div></div><div class="card section"><h2>♡ 健康与习惯记录</h2><div class="grid cols4">${[['sleep','睡眠时长（小时）','number',saved?.sleep||''],['bed','入睡时间','time',saved?.bed||''],['wake','起床时间','time',saved?.wake||''],['energy','当前精力（0—10）','number',saved?.energy??6]].map(([n,l,t,v])=>`<label class="field">${l}<input name="${n}" type="${t}" value="${v}" ${n==='energy'?'min="0" max="10"':n==='sleep'?'min="0" max="24" step="0.1"':''}></label>`).join('')}</div><div class="actions">${['喝水','运动 / 散步','主动回忆','按时休息'].map((l,i)=>`<label class="checkline"><input type="checkbox" name="habit${i}" ${saved?.habits?.[i]?'checked':''}>${l}</label>`).join('')}</div></div></form><div class="card section"><h2>今日状态 · 精力变化</h2><p class="subtext">基于本人在执行检查和复盘中的评分，展示最近 12 次反馈。</p>${chart()}</div><div class="card section"><h2>复盘档案</h2>${state.reviews.filter(r=>r.type==='daily').slice(-5).reverse().map(r=>`<div class="taskrow"><div class="body"><h3>${esc(r.date)}</h3><p>${esc(r.summary||'未填写成果总结')}</p><p>${esc(r.difficulty||'')}</p></div>${tag('本人复盘')}</div>`).join('')||'<p class="muted section">这里会留住你每一天的思考。</p>'}</div>`}
function saveReview(f){const d=Object.fromEntries(new FormData(f));state.reviews.push({type:'daily',date:C.dateKey(Date.now()),at:Date.now(),summary:d.summary,difficulty:d.difficulty,sleep:d.sleep,bed:d.bed,wake:d.wake,energy:+d.energy,flower:Array.from({length:8},(_,i)=>+d['flower'+i]),habits:Array.from({length:4},(_,i)=>!!d['habit'+i])});state.reviews.push({type:'energy',at:Date.now(),energy:+d.energy});C.log(state,'review.saved',null,'保存今日复盘与生命之花评分');if(d.carry==='keep')C.schedule(state);persistRender();toast('复盘已保存，明日安排已按选择处理')}
function settingsPage(){return `<div class="grid cols2"><div class="card"><h2>◷ 固定事务保护</h2><p class="subtext">排期时避开这些每日固定时段，工作窗口为 08:00—22:00（北京时间）。</p>${state.fixed.map(f=>`<div class="taskrow"><div class="body"><h3>${esc(f.title)}</h3><p>${esc(f.start)}—${esc(f.end)}</p></div><button class="plain" onclick="fixedForm('${f.id}')">编辑</button><button class="plain danger" onclick="removeFixed('${f.id}')">移除</button></div>`).join('')}<button class="section" onclick="fixedForm()">＋ 固定课程 / 生活事务</button></div><div class="card"><h2>数据与备份</h2><p class="subtext section">任务、排期、提醒和复盘在当前浏览器保存。浏览器清理数据可能导致丢失，建议定期备份。</p><div class="actions"><button class="primary" onclick="exportData()">导出工作区 JSON</button><button onclick="restoreForm()">导入备份</button></div><div class="notice section">JSON 包含证据元数据，不包含上传的文件本体。请另行保存原始证据文件。</div><p class="subtext">工作区是本机分区，不能代替云账号、身份认证或服务器权限控制。</p></div><div class="card"><h2>连接状态</h2>${['云账号与权限隔离','AI 模型与自动审核','桌面活动助手','摄像头辅助观察','关页提醒与后台服务'].map(l=>`<div class="row section"><span>${l}</span>${tag('未接入')}</div>`).join('')}<p class="subtext section">网页运行时的计时和动态提醒已启用；休眠或长时间挂起后会暂停计时并请求确认。</p></div><div class="card"><h2>检查与追溯</h2><p class="subtext section">任务变化、排期、干预、证据与核对结果保留历史。测试时间不会写入真实工作区。</p><div class="actions"><button onclick="runSelfTest()">运行隔离自检</button><button onclick="historyForm()">查看全部事件</button></div><div id="selfTestResult" class="section"></div></div></div>`}
function fixedForm(id){const f=state.fixed.find(x=>x.id===id)||{};modal('保护固定事务','课程、吃饭、通勤与休息都应占有自己的时间。',`<form onsubmit="event.preventDefault();saveFixed('${id||''}',this)"><label class="field">事务名称<input name="title" required value="${esc(f.title)}"></label><div class="grid cols2"><label class="field">开始<input type="time" name="start" required value="${f.start||'09:00'}"></label><label class="field">结束<input type="time" name="end" required value="${f.end||'10:00'}"></label></div><button class="primary">保存并重新排期</button></form>`)}
function saveFixed(id,f){const d=Object.fromEntries(new FormData(f));if(d.end<=d.start)return toast('结束时间必须晚于开始时间；跨天事务请拆成两项');if(id)Object.assign(state.fixed.find(x=>x.id===id),d);else state.fixed.push({id:C.uid(),...d});C.schedule(state);C.log(state,'fixed.updated',null,'固定事务已更新，重新计算排期');closeModal();persistRender()}
function removeFixed(id){const old=state.fixed.find(x=>x.id===id);state.fixed=state.fixed.filter(f=>f.id!==id);C.schedule(state);persistRender();toast('已移除固定事务，可通过添加恢复：'+old.title)}
function exportData(){const blob=new Blob([JSON.stringify({workspace,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);downloadURL(url,'上岸鸭V10-'+workspace+'-'+C.dateKey(Date.now())+'.json');setTimeout(()=>URL.revokeObjectURL(url),10000)}
function restoreForm(){modal('导入工作区备份','导入将合并新记录，不覆盖同 ID 的现有记录。证据文件本体需要重新关联。',`<input type="file" accept=".json,application/json" id="backupFile"><button class="primary section" onclick="restoreData()">校验并合并备份</button>`)}
async function restoreData(){const f=$('#backupFile').files[0];if(!f)return toast('请选择备份');try{const raw=JSON.parse(await f.text()),s=raw.state;if(s?.version!==10||!Array.isArray(s.tasks)||!Array.isArray(s.events))throw Error('不是有效的 V10 备份');for(const t of s.tasks)if(typeof t.id!=='string'||!/^[-a-zA-Z0-9]+$/.test(t.id)||!Array.isArray(t.evidence)||!Array.isArray(t.outputs)||typeof t.title!=='string'||!Number.isFinite(t.estimate))throw Error('任务数据结构不完整');let n=0;for(const key of ['tasks','blocks','events','reminders','interventions','reviews','resources']){if(!Array.isArray(s[key]))continue;for(const item of s[key]){if(key==='tasks'&&item.status==='执行中')item.status='已暂停';if(!state[key].some(x=>x.id&&x.id===item.id)){state[key].push(item);if(key==='tasks')n++}}}C.log(state,'backup.imported',null,'合并导入 '+n+' 项任务');closeModal();persistRender();toast('备份已合并，证据文件请按需重新上传')}catch(e){toast('导入失败：'+e.message)}}
function historyForm(){modal('真实事件记录','保留任务和状态变化的原始时间。',state.events.slice().reverse().map(e=>`<div class="logitem"><small>${fmt(e.at)} · ${esc(e.type)}</small>${esc(e.text)}</div>`).join('')||'<small>暂无记录</small>')}
function selfTests(){const out=[],assert=(label,test)=>{try{if(!test())throw Error('结果不符');out.push({label,ok:true})}catch(e){out.push({label,ok:false,error:e.message})}};const now=C.local('2026-11-02','09:00');assert('90 分钟触发干预并暂停，断点事件保留',()=>{const s=C.blank(),t=C.add(s,{title:'测试',estimate:180},now);C.start(s,t.id,now);t.continuous=5399;C.tick(s,now+1000);return t.status==='已暂停'&&s.interventions.length===1&&s.events.some(e=>e.type==='execution.paused')});assert('连续两次无产出提前诊断',()=>{const s=C.blank(),t=C.add(s,{title:'测试'},now);C.start(s,t.id,now);C.check(s,t.id,'',now+1000);C.check(s,t.id,'',now+2000);return s.interventions.length===1});assert('5 分钟停止检查与 15 分钟行动复查',()=>{const s=C.blank(),t=C.add(s,{title:'测试'},now),i=C.intervene(s,t.id,'测试',now);C.diagnose(s,i.id,'技术错误','正常','保存报错与文件',now);C.tick(s,now+900000);return i.done5&&i.done15&&i.stopStatus==='无法核验'&&s.tasks.some(a=>a.parent===t.id)});assert('排期不覆盖固定午餐与晚餐',()=>{const s=C.blank();C.add(s,{title:'长任务',estimate:600},now);C.schedule(s,now);return s.blocks.length>0&&s.blocks.every(b=>s.fixed.every(f=>!(b.start<C.local(C.dateKey(b.start),f.end)&&b.end>C.local(C.dateKey(b.start),f.start))))});assert('无证据不能验收通过',()=>{const s=C.blank(),t=C.add(s,{title:'测试'},now);try{C.accept(s,t.id,'验收通过','人工核对',now);return false}catch{return true}});assert('验收通过取消失效提醒',()=>{const s=C.blank(),t=C.add(s,{title:'测试'},now);t.evidence.push({id:'test'});C.remind(s,t.id,'test','测试','',now+60000);C.accept(s,t.id,'验收通过','人工核对完成',now);return t.status==='验收通过'&&s.reminders.every(r=>r.state==='已取消')});assert('验收失败生成关联返工',()=>{const s=C.blank(),t=C.add(s,{title:'测试'},now);C.accept(s,t.id,'验收失败','缺少运行结果',now);return s.tasks.some(x=>x.parent===t.id)});assert('页面挂起不把离开时间计为执行',()=>{const s=C.blank(),t=C.add(s,{title:'测试'},now);C.start(s,t.id,now);C.tick(s,now+600000);return t.total===0&&t.status==='已暂停'});return out}
function runSelfTest(){const out=selfTests();$('#selfTestResult').innerHTML=out.map(x=>`<p class="subtext" style="color:${x.ok?'var(--green)':'var(--red)'}">${x.ok?'✓':'✕'} ${x.label}${x.error?'：'+esc(x.error):''}</p>`).join('')}
function switchWorkspace(w){const t=active();if(t)C.pause(state,t.id,'切换本地工作区');save();workspace=w;localStorage.setItem('duck-v10-workspace',w);load();mode=state.preferences?.mode||'普通番茄';minutes=state.preferences?.minutes||25;query='';$('#search').value='';view='today';location.hash='today';render()}
$('#workspace').addEventListener('change',e=>switchWorkspace(e.target.value));$('#search').addEventListener('input',e=>{query=e.target.value;filter='全部';if(view!=='tasks')view='tasks';render()});window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(TITLES[v]){view=v;render()}});window.addEventListener('pagehide',()=>{if(active())C.pause(state,active().id,'离开网页，自动暂停');save()});document.addEventListener('keydown',e=>{if(e.code==='Space'&&view==='focus'&&!$('#modal').open&&!['INPUT','TEXTAREA','SELECT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();toggleFocus()}});
load();mode=state.preferences?.mode||'普通番茄';minutes=state.preferences?.minutes||25;view=TITLES[location.hash.slice(1)]?location.hash.slice(1):'today';initDB();render();
setInterval(()=>{const t=active();const newDue=C.tick(state);if(t&&t.status==='执行中'&&t.sessionSeconds>=minutes*60&&!t.pomodoroNotified&&mode!=='沉浸正计时'){t.pomodoroNotified=true;C.remind(state,t.id,'pomo:'+t.sessionId,'这一轮专注结束了','记录产出，选择继续、休息或提交成果。',Date.now(),'check');C.pause(state,t.id,'本轮专注结束，等待反馈');if(!$('#modal').open)render()}updateTimer();save();const due=state.reminders.filter(r=>r.state==='已触发');$('#bell').textContent=due.length;showDue(due)},1000);

function referenceHTML(t){const src=t?.referenceImage;if(!src||!/^data:image\/(png|jpeg|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(src))return '';return `<figure style="margin:12px 0;padding:12px;border:1px dashed var(--line);border-radius:10px"><figcaption class="subtext">交付物参考示例 · 不作为已完成证据</figcaption><img src="${esc(src)}" alt="交付物参考示例图" style="display:block;max-width:100%;max-height:230px;object-fit:contain;margin-top:8px"></figure>`}
function previewReference(input){const file=input.files[0];if(!file)return;if(!['image/png','image/jpeg','image/webp','image/gif'].includes(file.type)||file.size>1024*1024){input.value='';return toast('请选择 PNG、JPG、WebP 或 GIF 图片，大小不超过 1MB')}const reader=new FileReader();reader.onerror=()=>toast('图片读取失败，请重新选择');reader.onload=()=>{input.form.elements.namedItem('referenceImage').value=reader.result;$('#referencePreview').innerHTML=referenceHTML({referenceImage:reader.result})};reader.readAsDataURL(file)}
function startLabel(t){if(t.plannedStart)return esc(fmt(t.plannedStart))+'（固定）';const b=state.blocks.filter(b=>b.taskId===t.id&&b.end>Date.now()).sort((a,b)=>a.start-b.start)[0];return b?esc(fmt(b.start))+'（自动安排）':'未确定 · DDL 前 72 小时自动检查'}
