<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B · 行动与排程</title><style>body{font:16px system-ui;background:#f3f6fb;color:#18283c;max-width:1100px;margin:32px auto;padding:20px}section,article{background:white;padding:20px;border-radius:14px;margin:16px 0}textarea{width:100%;min-height:150px;box-sizing:border-box}button{padding:10px 18px;margin:8px;background:#285bd6;color:white;border:0;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere}label{display:block;margin:10px}input{padding:8px}#notice{white-space:pre-wrap;color:#914600}</style><h1>把差距变成行动</h1><p>导入 A 的诊断 → 查看任务卡 → 自己选择任务 → 预览日程 → 导出给队长采用。</p><p>规则计算草案；不会自动宣称成果已完成。此页面不保存项目，离开前请导出。</p><button id="demo">载入演示数据</button><section><h2>1. 诊断与项目</h2><textarea id="diagnosis" aria-label="A 的诊断包 JSON"></textarea><label>项目截止日期 <input id="deadline" type="date"></label><button id="generate">生成任务卡</button></section><section><h2>2. 选择要安排的任务</h2><div id="tasks"></div></section><section><h2>3. 空闲时段与突发占用</h2><p>可编辑 JSON：windows 为空闲，busy 为临时占用，full_dates 为整天排满。时间采用 Asia/Shanghai。每日上限会扣除缓冲时间。</p><textarea id="settings" aria-label="排程设置 JSON"></textarea><button id="schedule">预览排程 / 局部重排</button><button id="export">导出计划包</button></section><p id="notice" role="status"></p><section><h2>计划、容量与变更理由</h2><pre id="result">尚未生成</pre></section><script src="planner.js"></script></html>
