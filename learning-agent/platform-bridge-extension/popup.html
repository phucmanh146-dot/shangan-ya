<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云端证据桥</title><style>body{font:13px "Microsoft YaHei",sans-serif;width:320px;padding:14px;color:#203328}h3{margin:0 0 10px}label{display:block;font-size:11px;color:#66756b;margin:9px 0 4px}input{width:100%;box-sizing:border-box;padding:8px;border:1px solid #dce5dc;border-radius:7px}button{margin-top:10px;border:0;border-radius:8px;background:#246a45;color:white;padding:9px 12px;cursor:pointer}button.secondary{background:#edf3ee;color:#355542}small{display:block;color:#78857b;margin-top:8px;line-height:1.5}#status{margin-top:8px;font-size:11px}</style><h3>上岸鸭 · 云端浏览器证据桥</h3><label>Railway 云端地址</label><input id="cloudUrl" placeholder="https://xxx.up.railway.app"><label>连接令牌（从云端中台配对后复制）</label><input id="token" type="password" autocomplete="off"><label>关联任务 ID（可选，避免多任务串证据）</label><input id="taskId" placeholder="ChatGPT 返回的 task_id"><button id="save">保存配置</button><button class="secondary" id="toggle">启用 / 暂停采集</button><button class="secondary" id="shot">采集当前标签页截图</button><div id="status">默认关闭。启用后仅采集已支持站点的最近可见对话文本；截图必须手动点击。</div><small>截图和页面文本会发送到你的云端中台。请勿在敏感页面启用采集。</small><script src="popup.js"></script></html>
