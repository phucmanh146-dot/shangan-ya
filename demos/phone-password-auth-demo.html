<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>上岸鸭｜手机号密码账号</title>
<style>
:root{--green:#17634e;--green2:#eaf4ef;--ink:#103c32;--muted:#78958c;--line:#d9e8e1;--bg:#f3f7f4;--red:#bd594d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px}
.shell{width:min(100%,560px);background:#fff;border:1px solid var(--line);border-radius:28px;padding:42px;box-shadow:0 20px 60px #153e2c12}
.logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:18px;letter-spacing:1px}.mark{width:42px;height:42px;border-radius:14px;background:var(--green);color:white;display:grid;place-items:center;font-size:22px}
h1{font-size:32px;line-height:1.35;margin:28px 0 10px;letter-spacing:1px}.sub{color:var(--muted);line-height:1.8;margin:0 0 28px}
.tabs{display:flex;background:#f1f6f3;padding:5px;border-radius:14px;gap:5px;margin-bottom:26px}.tab{border:0;background:transparent;color:#658078;border-radius:10px;padding:12px;flex:1;font-size:15px;font-weight:700;cursor:pointer}.tab.active{background:#fff;color:var(--green);box-shadow:0 2px 10px #173e2c12}
label{display:block;font-size:14px;font-weight:700;margin:18px 0 9px}.field{width:100%;height:54px;border:1px solid var(--line);border-radius:14px;padding:0 16px;font-size:16px;outline:none;color:var(--ink);background:#fff}.field:focus{border-color:var(--green);box-shadow:0 0 0 3px #17634e14}.hint{font-size:12px;color:var(--muted);margin:8px 2px 0;line-height:1.6}
.primary{width:100%;height:56px;margin-top:26px;border:0;border-radius:15px;background:var(--green);color:#fff;font-size:17px;font-weight:800;cursor:pointer}.primary:hover{background:#10533f}.notice{display:none;margin-top:18px;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.6}.notice.error{display:block;background:#fff3f1;color:var(--red);border:1px solid #f5d8d3}.notice.success{display:block;background:#edf7f1;color:#17634e;border:1px solid #d4eadc}
.foot{margin-top:24px;padding-top:18px;border-top:1px solid #edf2ef;color:#8aa198;font-size:12px;line-height:1.7}.hide{display:none!important}.success-panel{text-align:center;padding:22px 0 6px}.check{width:64px;height:64px;margin:0 auto 18px;border-radius:50%;background:var(--green2);display:grid;place-items:center;color:var(--green);font-size:30px}.secondary{margin-top:12px;background:white;border:1px solid var(--line);color:var(--green);height:48px;border-radius:13px;padding:0 18px;font-weight:700;cursor:pointer}
@media(max-width:520px){body{padding:12px}.shell{padding:28px 22px;border-radius:22px}h1{font-size:27px}}
</style>
</head>
<body>
<main class="shell">
  <div class="logo"><div class="mark">鸭</div><span>上岸鸭 · 个人执行工作台</span></div>
  <section id="auth">
    <h1 id="heading">绑定手机号，设置登录密码</h1>
    <p class="sub" id="subtitle">手机号就是你的账号。首次设置密码后，以后只需手机号和密码登录，不发送短信验证码。</p>
    <div class="tabs"><button class="tab active" id="registerTab" type="button">创建账号</button><button class="tab" id="loginTab" type="button">已有账号 · 登录</button></div>
    <form id="authForm" novalidate>
      <label for="phone">手机号</label>
      <input class="field" id="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="11" placeholder="请输入 11 位手机号">
      <div id="passwordArea">
        <label for="password">设置密码</label>
        <input class="field" id="password" type="password" autocomplete="new-password" placeholder="至少 8 位，建议字母、数字和符号组合">
        <div class="hint" id="passwordHint">密码区分大小写。请牢记密码；演示版不提供短信找回。</div>
        <div id="confirmArea">
          <label for="confirm">再次确认密码</label>
          <input class="field" id="confirm" type="password" autocomplete="new-password" placeholder="请再次输入密码">
        </div>
      </div>
      <div id="notice" class="notice" role="alert" aria-live="polite"></div>
      <button class="primary" id="submit" type="submit">创建账号</button>
    </form>
    <div class="foot">不使用短信验证码。一个手机号只能绑定一个账号。此页面为交互演示：账号数据仅保存在当前浏览器，不能跨设备使用；正式上线需接入服务端数据库、密码哈希和安全限流。</div>
  </section>
  <section id="done" class="success-panel hide">
    <div class="check">✓</div><h1>账号已创建</h1><p class="sub">手机号已绑定。下次请使用手机号和刚设置的密码登录。</p>
    <button class="primary" id="goLogin" type="button">现在去登录</button>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);
let mode='register';
const STORE='shanganya_phone_password_demo_v1';
function accounts(){try{return JSON.parse(localStorage.getItem(STORE)||'{}')}catch{return {}}}
function message(text,type='error'){$('notice').textContent=text;$('notice').className='notice '+type}
function clearMessage(){$('notice').textContent='';$('notice').className='notice'}
function switchMode(next){
 mode=next;clearMessage();$('registerTab').classList.toggle('active',mode==='register');$('loginTab').classList.toggle('active',mode==='login');
 $('heading').textContent=mode==='register'?'绑定手机号，设置登录密码':'欢迎回来，登录上岸鸭';
 $('subtitle').textContent=mode==='register'?'手机号就是你的账号。首次设置密码后，以后只需手机号和密码登录，不发送短信验证码。':'输入注册时绑定的手机号和密码。密码必须完全一致，输错一位也无法登录。';
 $('confirmArea').classList.toggle('hide',mode==='login');$('password').autocomplete=mode==='login'?'current-password':'new-password';
 $('password').placeholder=mode==='login'?'请输入登录密码':'至少 8 位，建议字母、数字和符号组合';
 $('passwordHint').textContent=mode==='login'?'密码区分大小写，请检查大小写及输入法状态。':'密码区分大小写。请牢记密码；演示版不提供短信找回。';
 $('submit').textContent=mode==='register'?'创建账号':'手机号 + 密码登录';
}
async function digest(password,salt){
 const enc=new TextEncoder();const key=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveBits']);
 const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:180000,hash:'SHA-256'},key,256);
 return Array.from(new Uint8Array(bits),b=>b.toString(16).padStart(2,'0')).join('');
}
function randomSalt(){const b=crypto.getRandomValues(new Uint8Array(16));return Array.from(b,x=>x.toString(16).padStart(2,'0')).join('')}
function validPhone(p){return /^1[3-9]\d{9}$/.test(p)}
$('registerTab').onclick=()=>switchMode('register');$('loginTab').onclick=()=>switchMode('login');
$('authForm').addEventListener('submit',async e=>{
 e.preventDefault();clearMessage();
 const phone=$('phone').value.trim(),password=$('password').value,confirm=$('confirm').value;
 if(!validPhone(phone)){message('请输入正确的 11 位中国大陆手机号。');$('phone').focus();return}
 if(!password){message('请输入密码。');$('password').focus();return}
 const db=accounts();
 if(mode==='register'){
  if(db[phone]){message('这个手机号已经注册过了，请直接切换到“已有账号 · 登录”。');return}
  if(password.length<8){message('密码至少需要 8 位。');$('password').focus();return}
  if(password!==confirm){message('两次输入的密码不一致，请重新确认。');$('confirm').focus();return}
  const salt=randomSalt(),hash=await digest(password,salt);
  db[phone]={salt,hash,createdAt:new Date().toISOString()};
  localStorage.setItem(STORE,JSON.stringify(db));
  $('auth').classList.add('hide');$('done').classList.remove('hide');
 }else{
  if(!db[phone]){message('手机号或密码错误，请检查后重试。');return}
  const hash=await digest(password,db[phone].salt);
  if(hash!==db[phone].hash){message('手机号或密码错误，请检查后重试。');$('password').select();return}
  message('登录成功！演示账号验证通过。','success');
 }
});
$('goLogin').onclick=()=>{$('done').classList.add('hide');$('auth').classList.remove('hide');switchMode('login');$('password').value='';$('confirm').value='';};
</script>
</body></html>
