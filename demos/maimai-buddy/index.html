<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>麦麦搭子 · 省着吃</title><style>body{margin:0;background:#f1cfca;color:#553731;font-family:'Microsoft Yahei',sans-serif}main{max-width:900px;margin:25px auto;padding:25px;border:2px solid #a65a55;border-radius:28px;background:#fff8ec;box-shadow:10px 10px #d59a94}h1{font-size:clamp(32px,5vw,60px);line-height:1.2}em{color:#b34d48;font-style:normal}h2{border-bottom:2px dashed #d3b6ad;padding:12px 0}.hero{background:#f9ded8;border-radius:20px;padding:20px}label{display:inline-grid;gap:8px;margin:8px;font-weight:bold}input,select,button{padding:13px;border:2px solid #d9ada4;border-radius:12px;font:inherit}button{cursor:pointer;background:#ad4a46;color:white;border:0;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{border:2px solid #e6c6b8;border-radius:20px;padding:18px;background:#fff;box-shadow:4px 4px #f3ddd1}.card button{width:100%}.price{color:#b34d48;font-size:24px;font-weight:bold}.note{background:#fae4dc;padding:12px;border-radius:13px}footer{text-align:center;color:#8b7872;padding:18px}@media(max-width:650px){main{margin:5px;padding:15px;box-shadow:none}.grid{grid-template-columns:1fr}}</style><main><header>🍟 麦麦搭子 · 省着吃 <small>奶奶的省钱手账 / 1024</small></header><div class="hero"><h1>下班路上，<br><em>把实惠攒成一顿热乎饭。</em></h1><p>不纠结今晚吃什么，先约搭子来投票。</p></div><h2>01 阿婆先问问</h2><label>每人预算 ¥<input id="budget" type="number" min="1" value="30"></label><label>几个人<select id="people"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option></select></label><label>今天偏爱<select id="taste"><option>都可以</option><option>汉堡</option><option>鸡肉</option><option>小食</option></select></label><p><button onclick="start()">✦ 写下今晚的选择</button></p><div class="note" id="status">演示模式：真实优惠和价格需通过已认证的麦当劳 MCP 计算。这里不生成虚假价格。</div><h2>02 三张手写菜单牌</h2><div class="grid" id="cards"></div><h2>03 大家投票的结果</h2><p id="result">等待投票……</p><button onclick="share()">复制邀请</button><footer>独立创意原型 · 非麦当劳官方应用 · 不自动下单 · 投票只在本页生效</footer></main><script>let names=['🍔 经典汉堡搭子','🍗 香香鸡肉搭子','🍟 小食分享搭子'],votes=[0,0,0];function render(){let total=votes.reduce((a,b)=>a+b,0);document.querySelector('#cards').innerHTML=names.map((name,i)=>'<article class="card"><h3>'+name+'</h3><p>阿婆推荐的投票主题</p><div class="price">待实时计价</div><p>真实套餐和优惠需 MCP 核对</p><button onclick="vote('+i+')">投一票 · '+votes[i]+'票</button><p>'+ (total?(votes[i]/total*100).toFixed(0):0)+'%</p></article>').join('');document.querySelector('#result').textContent=total?'当前领先：'+names[votes.indexOf(Math.max(...votes))]+'，共'+total+'票':'等待投票……'}function vote(i){votes[i]++;render()}function start(){votes=[0,0,0];render();document.querySelector('#status').textContent='阿婆收到：'+document.querySelector('#people').value+'个人，每人预算¥'+document.querySelector('#budget').value+'，偏好：'+document.querySelector('#taste').value+'。现在投票，实时价格需另行验证。'}function share(){let t='今晚麦麦搭子投票：'+names.join(' / ');navigator.clipboard?.writeText(t).then(()=>alert('邀请已复制')).catch(()=>prompt('复制邀请',t))}render()</script></html>
