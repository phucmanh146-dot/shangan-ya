name: Shared Agent regression
on:
  pull_request:
  push:
    branches: [main]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r learning-agent/requirements-engineering.txt
      - run: python -m unittest discover -s learning-agent -q
      - run: python -m unittest discover -s learning-agent/visual-workflow -q
      - run: node --check learning-agent/visual-workflow/shared-workbench.js
      - run: git diff --check
